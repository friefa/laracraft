name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Derive base/head SHAs for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v4

      - name: Affected lint, typecheck, test, build
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t lint typecheck test build

      - name: All lint, typecheck, test, build
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t lint typecheck test build

      - name: Upload web build
        uses: actions/upload-artifact@v5
        with:
          name: laracraft-web
          path: dist/apps/laracraft/browser
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android debug build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Capacitor 8 requires JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Accepts SDK licenses so AGP can install missing platforms/build-tools.
      - uses: android-actions/setup-android@v3

      # Caches Gradle distributions/dependencies and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: pnpm exec nx run laracraft:android-build

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: laracraft-debug-apk
          path: apps/laracraft/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Swift Package Manager (no CocoaPods): xcodebuild resolves
      # capacitor-swift-pm from CapApp-SPM/Package.swift on its own.
      - name: Build for iOS Simulator (unsigned)
        run: pnpm exec nx run laracraft:ios-build
